<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromance Effect Editor</title>
    <link rel="stylesheet" href="css/index.css">
</head>

<body>
    <header>
        <div class="header-top">
            <button id="backButton" class="back-button" title="Back to Profile Manager" aria-label="Back to Profile Manager">← Back</button>
            <h1 id="profileTitle">Profile editor: Default</h1>
        </div>
        <div class="profile-selector">
            <div class="profile-selector-container">
                <select id="profileDropdown"></select>
                <button id="editProfileNameButton" title="Edit Profile Name" aria-label="Edit Profile Name">✏️</button>
                <button id="addProfileButton" title="Add Profile" aria-label="Add Profile">➕</button>
                <button id="deleteProfileButton" title="Delete Profile" aria-label="Delete Profile">🗑️</button>
            </div>
            <div id="profileNameEditContainer" style="display: none; margin-top: 10px;">
                <input type="text" id="profileNameInput" placeholder="Enter profile name" style="padding: 8px; border-radius: 4px; border: 1px solid var(--border-color); width: 200px;">
                <button id="saveProfileNameButton" title="Save Profile Name" style="margin-left: 5px; padding: 8px 12px; background-color: var(--primary-color); color: white; border: none; border-radius: 4px;">Save</button>
                <button id="cancelProfileNameButton" title="Cancel" style="margin-left: 5px; padding: 8px 12px; background-color: #6c757d; color: white; border: none; border-radius: 4px;">Cancel</button>
            </div>
        </div>
    </header>
    <main>
        <div class="container" id="container">
            <button id="editNodeButton" class="edit-node-button" title="Edit Node Properties" aria-label="Edit Node Properties">⚙️</button>
            <!-- Nodes -->
            <div class="hex-wrap">
                <div title="node 0" class="hex" data-id="0"></div>
            </div>
            <div class="hex-wrap">
                <div title="node 1" class="hex" data-id="1"></div>
            </div>
            <div class="hex-wrap">
                <div title="node 2" class="hex" data-id="2"></div>
            </div>
            <div class="hex-wrap">
                <div title="node 3" class="hex" data-id="3"></div>
            </div>
            <div class="hex-wrap">
                <div title="node 4" class="hex" data-id="4"></div>
            </div>
            <div class="hex-wrap">
                <div title="node 5" class="hex" data-id="5"></div>
            </div>
            <div class="hex-wrap">
                <div title="node 6" class="hex" data-id="6"></div>
            </div>
            <div class="hex-wrap">
                <div title="node 7" class="hex" data-id="7"></div>
            </div>
            <div class="hex-wrap">
                <div title="node 8" class="hex" data-id="8"></div>
            </div>
            <div class="hex-wrap">
                <div title="node 9" class="hex" data-id="9"></div>
            </div>
            <div class="hex-wrap">
                <div title="node 10" class="hex" data-id="10"></div>
            </div>
            <div class="hex-wrap">
                <div title="node 11" class="hex" data-id="11"></div>
            </div>
            <div class="hex-wrap">
                <div title="node 12" class="hex" data-id="12"></div>
            </div>
            <div class="hex-wrap">
                <div title="node 13" class="hex" data-id="13"></div>
            </div>
            <div class="hex-wrap">
                <div title="node 14" class="hex" data-id="14"></div>
            </div>
            <div class="hex-wrap">
                <div title="node 15" class="hex" data-id="15"></div>
            </div>
            <div class="hex-wrap">
                <div title="node 16" class="hex" data-id="16"></div>
            </div>
            <div class="hex-wrap">
                <div title="node 17" class="hex" data-id="17"></div>
            </div>
            <div class="hex-wrap">
                <div title="node 18" class="hex" data-id="18"></div>
            </div>
        </div>
        <aside>
            <nav class="menu">
            </nav>
            <nav class="controls">
                <button id="toggleBiNodes">Toggle Bi-Nodes</button>
                <button id="toggleTriNodes">Toggle Tri-Nodes</button>
                <button id="toggleQuadNodes">Toggle Quad-Nodes</button>
                <button id="deactivateAllNodes">De-activate all nodes</button>
            </nav>
            <nav class="menu">
                <button id="discardChanges" class="discard-button" title="Discard Changes">↶</button>
                <button id="applyChanges" class="apply-button" title="Apply Changes">💾</button>
            </nav>
        </aside>
        <div class="overlay" id="overlay"></div>
        <div class="modal" id="modal">
            <h2>Profile Properties
                <i class="info-icon">i
                    <span class="tooltiptext">Configure the settings for this profile</span>
                </i>
            </h2>
            <div class="modal-settings">
                <div class="setting-container">
                    <label>Starting Color(s):</label>
                    <div class="color-button-container">
                        <button id="addModalColorButton" class="add-color-button">+</button>
                        <button id="removeModalColorButton" class="remove-color-button">-</button>
                        <button id="modalRainbowButton">Rainbow</button>
                        <button id="modalRandomButton">Random</button>
                        <button id="modalSimilarButton">Similar</button>
                    </div>
                    <div id="modalColorContainer" class="color-container">
                    </div>
                </div>
                <div class="setting-container">
                    <label for="modalDesiredBehavior">Desired behavior:</label>
                    <select id="modalDesiredBehavior">
                        <option value="0">weaksauce</option>
                        <option value="1">feisty</option>
                        <option value="2">angry</option>
                        <option value="3">alwaysTurnsRight</option>
                        <option value="4">alwaysTurnsLeft</option>
                    </select>
                </div>
                <div class="setting-container">
                    <label for="modalRippleDirection">Ripple direction:</label>
                    <select id="modalRippleDirection">
                        <option value="-1">All directions</option>
                        <option value="0">0°</option>
                        <option value="1">60°</option>
                        <option value="2">120°</option>
                        <option value="3">180°</option>
                        <option value="4">240°</option>
                        <option value="5">300°</option>
                    </select>
                </div>
                <div class="setting-container">
                    <label for="modalRippleDelay">Delay between ripples [1 - 60000]:</label>
                    <input type="number" id="modalRippleDelay" min="1" max="60000" value="3000">
                </div>
                <div class="setting-container">
                    <label for="modalRippleLifeSpan">Ripple life span [1 - 60000]:</label>
                    <input type="number" id="modalRippleLifeSpan" min="1" max="60000" value="3000">
                </div>
                <div class="setting-container">
                    <label for="modalRippleSpeed">Ripple speed [0.01 - 5]:</label>
                    <input type="range" id="modalRippleSpeed" min="0.01" max="5" step="0.01" value="0.5">
                    <span id="modalRippleSpeedDisplay">0.5</span>
                </div>
                <div class="setting-container">
                    <label for="modalDecayPerTick">Decay per tick [0.90 - 1]:</label>
                    <input type="range" id="modalDecayPerTick" min="0.90" max="1" step="0.001" value="0.985">
                    <span id="modalDecayPerTickDisplay">0.985</span>
                </div>
                <div class="setting-container">
                    <label for="modalHueDeltaTick">Hue delta per tick [0 - 500]:</label>
                    <input type="number" id="modalHueDeltaTick" min="0" max="500" value="200">
                </div>
            </div>
            <div class="modal-buttons">
                <button id="saveNodeButton" class="modal-save-button">💾</button>
                <button id="discardNodeButton" class="modal-discard-button">↶</button>
            </div>
        </div>
    </main>
    <script type="module" src="js/main.js"></script>
</body>

</html>
