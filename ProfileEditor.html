<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromance Effect Editor</title>
    <link rel="stylesheet" href="css/index.css">
</head>

<body>
    <header>
        <div class="header-top">
            <button id="backButton" class="back-button" title="Back to Profile Manager"
                aria-label="Back to Profile Manager">&larr; Back</button>
            <h1 id="profileTitle">Profile editor: Default</h1>
        </div>
        <div class="profile-selector">
            <div class="profile-selector-container">
                <select id="profileDropdown"></select>
                <button id="editProfileNameButton" title="Edit Profile Name"
                    aria-label="Edit Profile Name">&#9998;</button>
                <button id="addProfileButton" title="Add Profile" aria-label="Add Profile">+</button>
                <button id="deleteProfileButton" title="Delete Profile" aria-label="Delete Profile">X</button>
            </div>
            <div id="profileNameEditContainer" style="display: none; margin-top: 10px;">
                <input type="text" id="profileNameInput" placeholder="Enter profile name"
                    style="padding: 8px; border-radius: 4px; border: 1px solid var(--border-color); width: 200px;">
                <button id="saveProfileNameButton" title="Save Profile Name"
                    style="margin-left: 5px; padding: 8px 12px; background-color: var(--primary-color); color: white; border: none; border-radius: 4px;">Save</button>
                <button id="cancelProfileNameButton" title="Cancel"
                    style="margin-left: 5px; padding: 8px 12px; background-color: #6c757d; color: white; border: none; border-radius: 4px;">Cancel</button>
            </div>
        </div>
    </header>
    <main>
        <!-- Profile-level controls -->
        <div class="profile-controls">
            <div class="setting-container">
                <label for="profilePeriodSlider">Profile Period:</label>
                <input type="range" id="profilePeriodSlider" min="500" max="60000" step="100" value="5000">
                <span id="profilePeriodDisplay">5000ms</span>
            </div>
            <div class="setting-container">
                <label>Colors:</label>
                <div class="color-button-container">
                    <button id="addColorButton" class="add-color-button">+</button>
                    <button id="removeColorButton" class="remove-color-button">-</button>
                    <button id="rainbowButton">Rainbow</button>
                    <button id="randomButton">Random</button>
                    <button id="similarButton">Similar</button>
                </div>
                <div id="colorContainer" class="color-container"></div>
            </div>
        </div>

        <!-- Hex Grid -->
        <div class="container" id="container">
            <div id="editorHexGrid" class="stable-hex-grid"
                style="width: 100%; height: 100%; max-width: 450px; display: flex; align-items: center; justify-content: center;">
            </div>
        </div>

        <aside>
            <nav class="controls">
                <button id="toggleBiNodes">Toggle Bi-Nodes</button>
                <button id="toggleTriNodes">Toggle Tri-Nodes</button>
                <button id="toggleQuadNodes">Toggle Quad-Nodes</button>
                <button id="deactivateAllNodes">Deactivate All</button>
            </nav>
        </aside>

        <!-- Event Settings Panel (inline, below grid) -->
        <div class="event-settings-panel" id="eventSettingsPanel">
            <h3 id="eventSettingsTitle">Event t0</h3>
            <div class="event-settings-grid">
                <div class="setting-container">
                    <label for="eventRippleType">Ripple Type:</label>
                    <select id="eventRippleType">
                        <option value="0">Single</option>
                        <option value="1">Double</option>
                        <option value="2">Shard</option>
                    </select>
                </div>
                <div class="setting-container">
                    <label for="eventBehavior">Behavior:</label>
                    <select id="eventBehavior">
                        <option value="0">weaksauce</option>
                        <option value="1">feisty</option>
                        <option value="2">angry</option>
                        <option value="3">alwaysTurnsRight</option>
                        <option value="4">alwaysTurnsLeft</option>
                    </select>
                </div>
                <div class="setting-container">
                    <label for="eventDirection">Direction:</label>
                    <select id="eventDirection">
                        <option value="-1">All directions</option>
                        <option value="0">0 deg</option>
                        <option value="1">60 deg</option>
                        <option value="2">120 deg</option>
                        <option value="3">180 deg</option>
                        <option value="4">240 deg</option>
                        <option value="5">300 deg</option>
                    </select>
                </div>
                <div class="setting-container">
                    <label for="eventSpeed">Speed:</label>
                    <input type="range" id="eventSpeed" min="0.01" max="5" step="0.01" value="0.5">
                    <span id="eventSpeedDisplay">0.50</span>
                </div>
                <div class="setting-container">
                    <label for="eventLifeSpan">Lifespan: <span id="eventLifeSpanBeats" class="beat-hint"></span></label>
                    <input type="number" id="eventLifeSpan" min="1" max="60000" value="3000">
                </div>
                <div class="setting-container">
                    <label for="eventHueDelta">Hue Delta:</label>
                    <input type="number" id="eventHueDelta" min="0" max="2000" value="200">
                </div>
            </div>
        </div>

        <!-- Timeline -->
        <div class="timeline-section">
            <div class="timeline-bar" id="timelineBar">
                <!-- Event markers rendered by JS -->
            </div>
            <div class="timeline-labels" id="timelineLabels"></div>
            <div class="timeline-actions">
                <button id="addEventButton" class="add-event-button">+ Event</button>
                <button id="removeEventButton" class="remove-event-button">- Event</button>
            </div>
        </div>

        <!-- Apply/Discard -->
        <nav class="menu">
            <button id="discardChanges" class="discard-button" title="Discard Changes">Discard</button>
            <button id="applyChanges" class="apply-button" title="Apply Changes">Apply</button>
        </nav>
    </main>
    <script type="module" src="js/main.js"></script>
</body>

</html>
